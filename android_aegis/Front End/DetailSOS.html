<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        /* CSS Tambahan untuk Detail SOS */
        .sos-detail-header { 
            background: #d32f2f; border-radius: 15px 15px 0 0; padding: 20px; 
            display: flex; align-items: center; gap: 15px; color: white; position: relative;
        }
        .sos-icon-box { 
            background: rgba(255,255,255,0.2); width: 50px; height: 50px; 
            border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px;
        }
        .badge-critical { 
            background: #b71c1c; color: white; font-size: 10px; padding: 4px 10px; 
            border-radius: 10px; position: absolute; right: 20px; border: 1px solid rgba(255,255,255,0.3);
        }

        .map-section { width: 100%; height: 250px; background: #eee; position: relative; }
        .map-section img { width: 100%; height: 100%; object-fit: cover; }
        .map-overlay-icon { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 60px; color: #f57c00; text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .sos-info-grid { display: grid; grid-template-columns: 1fr 1fr; padding: 20px; gap: 20px; background: white; }
        .info-label-small { font-size: 11px; color: #999; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .info-content-row { display: flex; align-items: center; gap: 10px; font-weight: bold; }

        .incident-description { 
            background: #f8f9fa; margin: 0 20px; padding: 20px; border-radius: 15px; 
            font-style: italic; color: #444; line-height: 1.6; border: 1px solid #f0f0f0;
        }

        /* Buttons Status */
        .btn-status { 
            display: block; width: calc(100% - 40px); margin: 25px 20px; padding: 18px; 
            border-radius: 15px; border: none; font-weight: bold; font-size: 16px; text-transform: uppercase;
        }
        .btn-status.waiting { background: #f29b9b; color: white; cursor: not-allowed; }
        .btn-status.resolved { background: #5c8aff; color: white; box-shadow: 0 4px 15px rgba(92, 138, 255, 0.3); }
    </style>
</head>
<body>

    <div class="container" style="padding-top: 10px;">
        <div style="display: flex; align-items: center; gap: 15px; margin-bottom: 20px;">
            <i class="fas fa-arrow-left" style="font-size: 24px;"></i>
            <h1 style="margin-bottom: 0;">PESAN SOS</h1>
        </div>

        <div style="background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
            <div class="sos-detail-header">
                <div class="sos-icon-box"><i class="fas fa-exclamation-triangle"></i></div>
                <div>
                    <h2 style="font-size: 20px;">PESAN SOS</h2>
                    <p style="font-size: 12px; opacity: 0.8;">ID: SOS-992384-TX</p>
                </div>
                <span class="badge-critical">CRITICAL</span>
            </div>

            <div class="map-section">
                <img src="https://via.placeholder.com/500x300" alt="Map View">
                <i class="fas fa-exclamation-triangle map-overlay-icon"></i>
            </div>

            <div class="sos-info-grid">
                <div>
                    <span class="info-label-small">Petugas</span>
                    <div class="info-content-row">
                        <i class="far fa-user-circle" style="color: #1565c0;"></i>
                        <span>Andika Pratama</span>
                    </div>
                </div>
                <div>
                    <span class="info-label-small">Waktu</span>
                    <div class="info-content-row">
                        <i class="far fa-clock" style="color: #1565c0;"></i>
                        <span>12 Okt, 23:45</span>
                    </div>
                </div>
            </div>

            <div class="incident-description">
                <span class="info-label-small" style="font-style: normal;">Deskripsi Kejadian</span>
                "Terdapat <span style="color: #d32f2f; font-weight: bold;">kebakaran</span> pada lokasi tersebut, pengirim memerlukan bantuan <span style="color: #1a237e; font-weight: bold;">satpam dan warga</span> segera."
            </div>

            <!-- Kondisi 1: Menunggu Bantuan -->
            <button class="btn-status waiting">Menunggu Bantuan</button>

            <!-- Kondisi 2 (Gunakan salah satu): Selesai Ditangani -->
            <!-- <button class="btn-status resolved">Selesai Ditangani Oleh Petugas Andi Sirandi</button> -->
        </div>
    </div>

</body>
</html>
