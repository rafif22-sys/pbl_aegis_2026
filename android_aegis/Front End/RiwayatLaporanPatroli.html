<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Laporan</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #f0f7ff; padding: 15px; }

        .header { display: flex; align-items: center; margin-bottom: 20px; }
        .back-btn { font-size: 24px; margin-right: 15px; cursor: pointer; }
        h2 { font-size: 22px; font-weight: bold; }

        .section-title {
            border-left: 5px solid #2196f3;
            padding-left: 10px;
            font-weight: bold;
            margin: 20px 0 15px 0;
            font-size: 18px;
        }

        .search-bar {
            background: white;
            padding: 10px 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            border: 1px solid #ddd;
            margin-bottom: 20px;
            color: #999;
        }

        /* Card Style */
        .report-card {
            background: white;
            border-radius: 20px;
            padding: 15px;
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-right: 8px solid #9e9e9e; /* Scrollbar mimic */
        }

        .date-box {
            background-color: #0d47a1;
            color: white;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            min-width: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .date-box .day { font-weight: bold; font-size: 16px; }
        .date-box .full-date { font-size: 11px; margin-top: 5px; }

        .info-list { flex: 1; list-style: none; }
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
            color: #555;
        }
        .info-label { display: flex; align-items: center; gap: 8px; }
        .info-value { font-weight: bold; color: #000; font-size: 16px; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left back-btn"></i>
        <h2>Laporan Patroli</h2>
    </div>

    <div class="section-title">Minggu Ini</div>

    <!-- Card 1 -->
    <div class="report-card">
        <div class="date-box">
            <span class="day">Jumat</span>
            <span class="full-date">14 April 2026</span>
        </div>
        <ul class="info-list">
            <li class="info-item">
                <span class="info-label"><i class="far fa-check-square"></i> Total Patroli</span>
                <span class="info-value">10</span>
            </li>
            <li class="info-item">
                <span class="info-label"><i class="fas fa-user-shield"></i> Petugas</span>
                <span class="info-value">24</span>
            </li>
            <li class="info-item">
                <span class="info-label"><i class="fas fa-map-marker-alt"></i> Total Checkpoint</span>
                <span class="info-value">24</span>
            </li>
        </ul>
    </div>

    <!-- Card 2 -->
    <div class="report-card">
        <div class="date-box">
            <span class="day">Kamis</span>
            <span class="full-date">13 April 2026</span>
        </div>
        <ul class="info-list">
            <li class="info-item">
                <span class="info-label"><i class="far fa-check-square"></i> Total Patroli</span>
                <span class="info-value">10</span>
            </li>
            <li class="info-item">
                <span class="info-label"><i class="fas fa-user-shield"></i> Petugas</span>
                <span class="info-value">24</span>
            </li>
            <li class="info-item">
                <span class="info-label"><i class="fas fa-map-marker-alt"></i> Total Checkpoint</span>
                <span class="info-value">24</span>
            </li>
        </ul>
    </div>

    <div class="section-title">Riwayat Laporan</div>
    
    <div class="search-bar">
        <i class="far fa-calendar-alt" style="margin-right: 10px;"></i>
        <span>Cari Tanggal</span>
    </div>

</body>
</html>
