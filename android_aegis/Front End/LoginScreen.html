<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #041221; /* Warna gelap background utama */
        }
        .aegis-logo-text {
            letter-spacing: 0.5em;
            background: linear-gradient(to right, #0a2342, #3b82f6, #0a2342);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card {
            background-color: #e3f2fd; /* Warna biru pucat kartu */
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="text-center mb-12">
        <div class="relative inline-block mb-2">
            <i class="fas fa-wolf-pack-battalion text-7xl text-blue-500"></i>
            </div>
        
        <h1 class="text-3xl font-bold text-blue-400 aegis-logo-text mb-1">AEGIS</h1>
        <p class="text-white text-[10px] uppercase tracking-widest leading-tight">
            Advanced Emergency<br>& Guard Information System
        </p>
    </div>

    <div class="login-card w-full max-w-sm rounded-[32px] p-8 shadow-2xl">
        <form>
            <div class="mb-6">
                <label class="block text-[10px] font-bold text-blue-900/60 uppercase tracking-wider mb-2 ml-1">
                    Email Petugas
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-blue-900/50">
                        <i class="far fa-address-card"></i>
                    </span>
                    <input type="email" 
                        placeholder="Masukkan email Anda" 
                        class="w-full py-4 pl-12 pr-4 bg-white text-blue-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-300 placeholder-blue-900/30 text-sm font-medium transition-all shadow-sm">
                </div>
            </div>

            <div class="mb-8">
                <label class="block text-[10px] font-bold text-blue-900/60 uppercase tracking-wider mb-2 ml-1">
                    Kata Sandi
                </label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-blue-900/50">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" 
                        placeholder="........." 
                        class="w-full py-4 pl-12 pr-4 bg-white text-blue-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-300 placeholder-blue-900/30 text-lg transition-all shadow-sm">
                </div>
            </div>

            <button class="w-full bg-[#0d2238] text-white py-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-black transition-colors mb-8 shadow-lg">
                <span class="tracking-widest">MASUK</span>
                <i class="fas fa-sign-in-alt"></i>
            </button>

            <div class="flex justify-between items-center text-[10px] font-bold text-blue-900/40 uppercase tracking-widest">
                <a href="#" class="hover:text-blue-900">Lupa Sandi?</a>
                <span class="text-blue-900/20">•</span>
                <a href="#" class="hover:text-blue-900">Bantuan</a>
            </div>
        </form>
    </div>

    <div class="mt-auto pt-8">
        <p class="text-gray-600 text-[9px] tracking-[0.3em] font-mono">
            V4.2.0-SECURE
        </p>
    </div>

</body>
</html>
