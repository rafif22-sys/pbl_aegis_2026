<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AEGIS - Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { background-color: #e3f2fd; height: 100vh; display: flex; flex-direction: column; }

        /* Header Dark Blue Section */
        .header-section {
            background-color: #102a43;
            height: 50%;
            border-bottom-left-radius: 60px;
            border-bottom-right-radius: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .logo-placeholder { font-size: 80px; color: #40a9ff; margin-bottom: 10px; }
        .brand-name { font-size: 32px; letter-spacing: 8px; font-weight: bold; margin-bottom: 5px; }
        .tagline { font-size: 12px; opacity: 0.8; line-height: 1.4; }

        /* Main Menu Buttons */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding-bottom: 80px;
        }

        .btn {
            width: 85%;
            padding: 20px;
            border-radius: 50px;
            border: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            cursor: pointer;
            text-decoration: none;
        }

        .btn-sos { background: linear-gradient(90deg, #ff4d4d, #f06292); border: 4px solid #ffcdd2; }
        .btn-laporan { background: linear-gradient(90deg, #2196f3, #4dabf5); border: 4px solid #bbdefb; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.05);
        }

        .nav-item { text-align: center; color: #9e9e9e; text-decoration: none; font-size: 12px; }
        .nav-item.active { color: #2196f3; }
        .nav-item i { font-size: 24px; display: block; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header-section">
        <div class="logo-placeholder"><i class="fas fa-shield-cat"></i></div>
        <div class="brand-name">A E G I S</div>
        <p class="tagline">Advanced Emergency<br>& Guard Information System</p>
    </div>

    <div class="main-content">
        <a href="#" class="btn btn-sos">
            <span>KIRIM SOS</span>
            <i class="fas fa-shield-alt" style="font-size: 30px;"></i>
        </a>
        <a href="#" class="btn btn-laporan">
            <span>LAPORAN</span>
            <i class="fas fa-file-alt" style="font-size: 30px;"></i>
        </a>
    </div>

    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <i class="fas fa-home"></i>
            Beranda
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-exclamation-triangle"></i>
            Riwayat
        </a>
        <a href="#" class="nav-item">
            <i class="fas fa-user"></i>
            Profil
        </a>
    </nav>

</body>
</html>
