<!DOCTYPE html>
<html lang="id">
<head>
    <style>
        /* CSS Tambahan untuk Detail Titik */
        .map-box { width: 100%; border-radius: 20px; overflow: hidden; margin: 20px 0; border: 2px solid white; }
        .point-card { background: white; border-radius: 20px; padding: 15px; margin-bottom: 15px; display: flex; gap: 15px; }
        .point-info { flex: 1; }
        .point-img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; cursor: pointer; }
        
        /* Modal Style */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            width: 90%;
            border-radius: 30px;
            padding: 20px;
            position: relative;
        }
        .modal-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .main-photo { width: 100%; border-radius: 20px; height: 400px; object-fit: cover; }
        .modal-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; font-size: 24px; }
    </style>
</head>
<body>
    <!-- Header Petugas -->
    <div style="display: flex; align-items: center; gap: 15px;">
        <i class="fas fa-arrow-left"></i>
        <div class="avatar"></div>
        <div>
            <div style="color: #0d47a1; font-size: 14px;">Petugas</div>
            <div style="font-weight: bold; font-size: 20px;">Budi Santoso</div>
        </div>
    </div>

    <!-- Map Placeholder -->
    <div class="map-box">
        <img src="https://via.placeholder.com/400x250" style="width: 100%;" alt="Map">
    </div>

    <!-- Titik Card -->
    <div class="point-card">
        <div class="point-info">
            <h3 style="margin-bottom: 10px;">Titik 1</h3>
            <p style="font-size: 14px; color: #666;">Waktu: 07.30</p>
            <p style="font-size: 14px; color: #666;">Kondisi: <span style="color: black; font-weight: bold;">Aman</span></p>
            <div style="background: #f5f5f5; padding: 8px; border-radius: 8px; margin-top: 5px;">
                <small>Catatan:</small><br>Keadaan aman dan gembok terpasang
            </div>
        </div>
        <img src="https://via.placeholder.com/150" class="point-img">
    </div>

    <!-- Modal Foto Laporan -->
    <div class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <i class="fas fa-arrow-left"></i>
                <h3 style="font-size: 18px;">Foto Laporan</h3>
            </div>
            <img src="https://via.placeholder.com/300x500" class="main-photo">
            <div class="modal-nav">
                <i class="fas fa-chevron-left"></i>
                <span style="font-size: 18px;">1</span>
                <i class="fas fa-chevron-right"></i>
            </div>
        </div>
    </div>
</body>
</html>
