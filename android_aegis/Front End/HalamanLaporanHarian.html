<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Harian - AEGIS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --bg-blue: #e3f2fd; --dark-blue: #102a43; --green-soft: #c8e6c9; --red-soft: #ffecb3; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: var(--bg-blue); padding: 20px; }

        .header { display: flex; align-items: center; margin-bottom: 25px; }
        .btn-back { font-size: 24px; margin-right: 15px; cursor: pointer; }
        .date-title { font-size: 20px; font-weight: bold; margin-top: 10px; }

        /* Stats Grid */
        .stats-container {
            background: white;
            border-radius: 25px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }
        .stat-card { border-radius: 15px; padding: 12px; position: relative; }
        .stat-card.blue { background-color: #e3f2fd; }
        .stat-card.green { background-color: #d1e7dd; }
        .stat-card.purple { background-color: #e0e0f8; }
        .stat-card.red { background-color: #f8d7da; }
        .stat-card i { position: absolute; right: 12px; top: 12px; font-size: 20px; opacity: 0.6; }
        .stat-num { font-size: 22px; font-weight: bold; display: block; }
        .stat-label { font-size: 12px; color: #666; }

        /* Shift Tabs */
        .shift-tabs {
            background: #e0e0e0;
            border-radius: 12px;
            display: flex;
            padding: 5px;
            margin-bottom: 25px;
        }
        .tab { flex: 1; text-align: center; padding: 10px; border-radius: 10px; cursor: pointer; color: #666; }
        .tab.active { background: white; color: black; font-weight: bold; }

        /* Officer Card */
        .officer-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .status-banner { display: flex; justify-content: space-between; padding: 10px 20px; color: white; font-weight: bold; }
        .status-banner.aman { background: #4caf50; }
        .status-banner.isu { background: #d32f2f; }
        .card-body { padding: 20px; display: flex; align-items: center; gap: 15px; position: relative; }
        .avatar { width: 50px; height: 50px; background: #ddd; border-radius: 50%; }
        .off-name { font-weight: bold; font-size: 18px; }
        .card-footer { padding: 0 20px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .btn-detail { color: #2196f3; text-decoration: none; display: flex; align-items: center; gap: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <i class="fas fa-arrow-left btn-back"></i>
        <h1>Laporan Harian</h1>
    </div>

    <div class="date-title">Jumat, 14 April 2026</div>

    <div class="stats-container">
        <div class="stat-card blue">
            <span class="stat-num">10</span>
            <span class="stat-label">Total Patroli</span>
            <i class="far fa-check-square"></i>
        </div>
        <div class="stat-card green">
            <span class="stat-num">24</span>
            <span class="stat-label">Total Checkpoint</span>
            <i class="fas fa-map-marker-alt"></i>
        </div>
        <div class="stat-card purple">
            <span class="stat-num">24</span>
            <span class="stat-label">Petugas</span>
            <i class="fas fa-user-tie"></i>
        </div>
        <div class="stat-card red">
            <span class="stat-num">24</span>
            <span class="stat-label">Isu</span>
            <i class="fas fa-exclamation-circle"></i>
        </div>
    </div>

    <div class="shift-tabs">
        <div class="tab active">Shift 1</div>
        <div class="tab">Shift 2</div>
        <div class="tab">Shift 3</div>
    </div>

    <div class="officer-card">
        <div class="status-banner aman">
            <span>Aman</span>
            <span>5 Checkpoint</span>
        </div>
        <div class="card-body">
            <div class="avatar"></div>
            <div class="off-name">Petugas: Budi Santoso</div>
        </div>
        <div class="card-footer">
            <span>Waktu: 07.00 - 09.00</span>
            <a href="#" class="btn-detail"><i class="far fa-file-alt"></i> Detail</a>
        </div>
    </div>

</body>
</html>
